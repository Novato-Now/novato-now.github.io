  <script src="legal-data.js"></script>
  <script>
    // Header spacer setup
    const header = document.getElementById("header");
    const spacer = document.getElementById("headerSpacer");
    if (header && spacer) {
      spacer.style.height = header.offsetHeight + "px";
    }

    // Watermark glow
    var footerWatermark = document.getElementById("footerWatermark");
    var watermarkText = footerWatermark
      ? footerWatermark.querySelector(".watermark-text")
      : null;
    if (footerWatermark && watermarkText) {
      footerWatermark.addEventListener("mousemove", function (e) {
        if (window.innerWidth > 768) {
          var rect = footerWatermark.getBoundingClientRect();
          var x = e.clientX - rect.left;
          var y = e.clientY - rect.top;
          watermarkText.style.background =
            "radial-gradient(circle 400px at " +
            x +
            "px " +
            y +
            "px, rgba(67, 206, 162, 0.55) 0%, rgba(24, 90, 157, 0.3) 25%, rgba(67, 206, 162, 0.1) 50%, rgba(255, 255, 255, 0.06) 70%)";
          watermarkText.style.webkitBackgroundClip = "text";
          watermarkText.style.backgroundClip = "text";
        }
      });
      footerWatermark.addEventListener("mouseleave", function () {
        if (window.innerWidth > 768) {
          watermarkText.style.background = "rgba(255, 255, 255, 0.06)";
          watermarkText.style.webkitBackgroundClip = "text";
          watermarkText.style.backgroundClip = "text";
        }
      });
    }

    // Determine which JSON to load from query param
    var params = new URLSearchParams(window.location.search);
    var page = params.get("page") || "privacy-policy";
    var allowed = [
      "privacy-policy",
      "terms-of-service",
      "cookies-policy",
      "delete-account",
    ];
    if (allowed.indexOf(page) === -1) page = "privacy-policy";

    document.title =
      page.replace(/-/g, " ").replace(/\b\w/g, function (c) {
        return c.toUpperCase();
      }) + " – ZoneUp";

    var data = window.legalData ? window.legalData[page] : null;
    if (data) {
      document.getElementById("legalTitle").textContent = data.title;

      var container = document.getElementById("legalContent");
      data.sections.forEach(function (section) {
        if (section.heading) {
          var h2 = document.createElement("h2");
          h2.className = "legal-section-title";
          h2.textContent = section.heading;
          container.appendChild(h2);
        }
        section.content.forEach(function (text) {
          var p = document.createElement("p");
          p.className = "legal-text";
          p.textContent = text;
          container.appendChild(p);
        });
      });
    }

    // Device-specific app store links for Legal page buttons
    var appleStoreUrl = "https://apps.apple.com/in/app/zoneup/id6744461293";
    var playStoreUrl = "https://play.google.com/store/apps/details?id=com.zoneup12345.zoneup";

    function getStoreUrl() {
      var userAgent = navigator.userAgent || navigator.vendor || window.opera || "";
      var isIOS = /iPad|iPhone|iPod/i.test(userAgent);
      var isMac = /Macintosh|Mac OS X/i.test(userAgent);
      var isAndroid = /Android/i.test(userAgent);
      var isWindows = /Windows NT/i.test(userAgent);

      if (isIOS || isMac) return appleStoreUrl;
      if (isAndroid || isWindows) return playStoreUrl;
      return appleStoreUrl;
    }

    document.querySelectorAll("[data-store-cta]").forEach(function (link) {
      var storeUrl = getStoreUrl();
      link.href = storeUrl;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
    });
  </script>
  <script>
    // Page transition: fade in on load, fade out on navigate
    function showPage() {
      document.body.classList.add("page-ready");
      document.body.classList.remove("page-leaving");
    }

    document.addEventListener("DOMContentLoaded", showPage);
    window.addEventListener("pageshow", showPage);

    document.addEventListener("click", function (e) {
      var link = e.target.closest("a[href]");
      if (!link) return;
      var href = link.getAttribute("href");
      if (
        !href ||
        href.startsWith("#") ||
        href.startsWith("javascript") ||
        link.target === "_blank"
      )
        return;
      e.preventDefault();
      document.body.classList.add("page-leaving");
      document.body.classList.remove("page-ready");
      setTimeout(function () {
        window.location.href = href;
      }, 300);
    });
  </script>
</body>
