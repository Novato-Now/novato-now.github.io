<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ZoneUp - Join Community">
    <meta property="og:description" content="View and join this community inside the ZoneUp app. Connect with your local neighborhood and meet people nearby.">
    <meta property="og:image" content="https://web-assets-r2.zoneup.in/hero.png">
    <meta property="og:url" content="https://zoneup.in">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ZoneUp - Join Community">
    <meta name="twitter:description" content="View and join this community inside the ZoneUp app.">
    <meta name="twitter:image" content="https://web-assets-r2.zoneup.in/hero.png">

    <link rel="icon" type="image/x-icon" href="https://web-assets-r2.zoneup.in/favIcon.svg">
    <title>Open in ZoneUp App</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        background-color: #060708;
        color: #ffffff;
        text-align: center;
        padding: 24px;
      }
      .logo-container {
        position: relative;
        margin-bottom: 24px;
      }
      .logo {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      }
      h1 {
        font-size: 24px;
        margin: 0 0 10px;
        font-weight: 700;
        color: #ffffff;
      }
      p.subtitle {
        color: #88888b;
        margin: 0 0 32px;
        max-width: 340px;
        line-height: 1.5;
        font-size: 15px;
      }
      .btn {
        background: linear-gradient(135deg, #007aff 0%, #0056b3 100%);
        color: #ffffff;
        text-decoration: none;
        padding: 15px 38px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 0.2px;
        box-shadow: 0 8px 24px rgba(0, 122, 255, 0.4);
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        border: none;
        outline: none;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 28px rgba(0, 122, 255, 0.5);
      }
      .btn:active {
        transform: translateY(0) scale(0.98);
      }
      .store-fallback {
        margin-top: 26px;
        font-size: 14px;
        color: #88888b;
      }
      .store-fallback a {
        color: #43cea2;
        text-decoration: none;
        font-weight: 500;
      }
      .store-fallback a:hover {
        text-decoration: underline;
      }
    </style>

    <script type="text/javascript">
      var appUrl = "";
      var fallbackUrl = "";
      var appOpened = false;

      function markAppOpened() {
        appOpened = true;
      }
      window.addEventListener("pagehide", markAppOpened);
      window.addEventListener("blur", markAppOpened);
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) markAppOpened();
      });

      function openZoneUp(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (!appUrl) return;

        var start = Date.now();
        window.location.href = appUrl;

        setTimeout(function () {
          var elapsed = Date.now() - start;
          if (!document.hidden && !appOpened && elapsed < 3500) {
            window.location.href = fallbackUrl;
          }
        }, 1800);
      }

      (function () {
        const path = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);
        let communityId = urlParams.get("communityId") || urlParams.get("c") || urlParams.get("community") || urlParams.get("id");

        if (!communityId) {
          const match = path.match(/(?:community|c)\/([^/?#]+)/i);
          if (match && match[1]) {
            communityId = match[1];
          }
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.zoneup12345.zoneup";
        const appStoreUrl = "https://apps.apple.com/in/app/zoneup/id6744461293";
        fallbackUrl = isAndroid ? playStoreUrl : (isIOS ? appStoreUrl : "https://zoneup.in");

        if (communityId && communityId.trim() !== "") {
          communityId = communityId.split("/")[0].split("?")[0].split("#")[0];

          if (isAndroid) {
            appUrl = `intent://c/${encodeURIComponent(communityId)}#Intent;scheme=zoneup;package=com.zoneup12345.zoneup;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
          } else {
            appUrl = `zoneup:///c/${encodeURIComponent(communityId)}`;
          }

          document.addEventListener("DOMContentLoaded", function () {
            var title = document.getElementById("pageTitle");
            var sub = document.getElementById("pageSubtitle");
            if (title) title.textContent = "Join Community on ZoneUp";
            if (sub) sub.textContent = "Click the button below to view and join this community inside the ZoneUp app.";
          });

          // Automatically attempt to open on mobile
          setTimeout(function () {
            if (isAndroid || isIOS) {
              openZoneUp();
            }
          }, 400);
        } else {
          fallbackUrl = "https://zoneup.in";
        }
      })();

      document.addEventListener("DOMContentLoaded", function () {
        var storeLink = document.getElementById("storeLink");
        if (storeLink && fallbackUrl) {
          storeLink.href = fallbackUrl;
        }
      });
    </script>
  </head>
  <body>
    <div class="logo-container">
      <img src="https://web-assets-r2.zoneup.in/logo.svg" class="logo" alt="ZoneUp Logo">
    </div>
    <h1 id="pageTitle">Opening Community...</h1>
    <p class="subtitle" id="pageSubtitle">Click the button below to join this community inside the ZoneUp app.</p>
    
    <a href="javascript:void(0)" id="goBtn" class="btn" onclick="openZoneUp(event)">Go to ZoneUp ⚡</a>

    <p class="store-fallback">
      Don't have the app? <a id="storeLink" href="https://apps.apple.com/in/app/zoneup/id6744461293" target="_blank" rel="noopener noreferrer">Download ZoneUp</a>
    </p>
  </body>
</html>
