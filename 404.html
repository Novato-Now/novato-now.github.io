<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="ZoneUp - Discover People Nearby">
    <meta property="og:description" content="View this post, profile, or community inside the ZoneUp app. Discover and meet amazing people who actually live near you, join local communities, and connect.">
    <meta property="og:image" content="https://web-assets-r2.zoneup.in/hero.png">
    <meta property="og:url" content="https://zoneup.in">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="ZoneUp - Discover People Nearby">
    <meta name="twitter:description" content="View this post, profile, or community inside the ZoneUp app. Discover and meet amazing people who actually live near you, join local communities, and connect.">
    <meta name="twitter:image" content="https://web-assets-r2.zoneup.in/hero.png">

    <title>ZoneUp</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #060708;
        color: #ffffff;
        text-align: center;
        padding: 20px;
      }
      .logo-container {
        position: relative;
        margin-bottom: 24px;
      }
      .logo {
        width: 100px;
        height: 100px;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        font-weight: 700;
      }
      p {
        color: #88888b;
        margin-bottom: 32px;
        max-width: 320px;
        line-height: 1.5;
        font-size: 15px;
      }
    </style>

    <script>
      (function () {
        const path = window.location.pathname;
        const urlParams = new URLSearchParams(window.location.search);

        // 1. Post matching
        let postId = urlParams.get("postId") || urlParams.get("p");
        if (!postId) {
          const sharedPostMatch = path.split("/SharedPost/");
          if (sharedPostMatch[1]) {
            postId = sharedPostMatch[1].split("/")[0].split("?")[0].split("#")[0];
          }
        }

        // 2. Profile matching
        let username = urlParams.get("username") || urlParams.get("u");
        if (!username) {
          const profileMatch = path.split("/Profile/");
          if (profileMatch[1]) {
            username = profileMatch[1].split("/")[0].split("?")[0].split("#")[0];
          }
        }

        // 3. Community matching (/c/ or /Community/ or /community/)
        let communityId = urlParams.get("communityId") || urlParams.get("c") || urlParams.get("community") || urlParams.get("id");
        if (!communityId) {
          const cMatch = path.split(/\/c\//i);
          const communityMatch = path.split(/\/community\//i);
          if (cMatch[1]) {
            communityId = cMatch[1].split("/")[0].split("?")[0].split("#")[0];
          } else if (communityMatch[1]) {
            communityId = communityMatch[1].split("/")[0].split("?")[0].split("#")[0];
          }
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        
        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.zoneup12345.zoneup";
        const appStoreUrl = "https://apps.apple.com/app/id6744461293";
        const fallbackUrl = isAndroid ? playStoreUrl : (isIOS ? appStoreUrl : "https://zoneup.in");

        let appUrl = "https://zoneup.in";
        let isRedirect = false;

        if (communityId && communityId.trim() !== "") {
          communityId = communityId.split("/")[0].split("?")[0].split("#")[0];
          if (isAndroid) {
            appUrl = `intent://c/${encodeURIComponent(communityId)}#Intent;scheme=zoneup;package=com.zoneup12345.zoneup;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
          } else {
            appUrl = `zoneup:///c/${encodeURIComponent(communityId)}`;
          }
          isRedirect = true;
        } else if (postId && postId.trim() !== "") {
          postId = postId.split("/")[0].split("?")[0].split("#")[0];
          if (isAndroid) {
            appUrl = `intent://SharedPost/${encodeURIComponent(postId)}#Intent;scheme=zoneup;package=com.zoneup12345.zoneup;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
          } else {
            appUrl = `zoneup:///SharedPost/${encodeURIComponent(postId)}`;
          }
          isRedirect = true;
        } else if (username && username.trim() !== "") {
          username = username.split("/")[0].split("?")[0].split("#")[0];
          if (isAndroid) {
            appUrl = `intent://Profile/${encodeURIComponent(username)}#Intent;scheme=zoneup;package=com.zoneup12345.zoneup;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
          } else {
            appUrl = `zoneup:///Profile/${encodeURIComponent(username)}`;
          }
          isRedirect = true;
        }

        if (isRedirect) {
          window.location.replace(appUrl);

          setTimeout(function () {
            if (!document.hidden) {
              window.location.replace(fallbackUrl);
            }
          }, 2000);
        } else {
          window.location.replace("https://zoneup.in");
        }
      })();
    </script>
  </head>
  <body>
    <div class="logo-container">
      <img src="https://web-assets-r2.zoneup.in/logo.svg" class="logo" alt="ZoneUp Logo">
    </div>
    <h1>Opening ZoneUp...</h1>
    <p>If you don't have the app installed, you will be redirected to the app store shortly.</p>
  </body>
</html>
