<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:type" content="website">
    <meta property="og:title" content="ZoneUp - Shared Post">
    <meta property="og:description" content="View this post inside the ZoneUp app. Connect with your local neighborhood, discover people nearby, and join the conversation.">
    <meta property="og:image" content="https://web-assets-r2.zoneup.in/hero.png">
    <meta property="og:url" content="https://zoneup.in">

    <title>Open in ZoneUp App</title>

    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #060708;
        color: #ffffff;
        text-align: center;
        padding: 20px;
      }
      .logo-container {
        position: relative;
        margin-bottom: 24px;
      }
      .logo {
        width: 100px;
        height: 100px;
        border-radius: 24px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        font-weight: 700;
      }
      p {
        color: #88888b;
        margin-bottom: 32px;
        max-width: 320px;
        line-height: 1.5;
        font-size: 15px;
      }
    </style>

    <script type="text/javascript">
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        let postId = urlParams.get("postId") || urlParams.get("p");

        if (!postId) {
          const pathParts = window.location.pathname.split("/SharedPost/");
          if (pathParts[1]) {
            postId = pathParts[1].split("/")[0].split("?")[0].split("#")[0];
          }
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

        const playStoreUrl = "https://play.google.com/store/apps/details?id=com.zoneup12345.zoneup";
        const appStoreUrl = "https://apps.apple.com/app/id6744461293";
        const fallbackUrl = isAndroid ? playStoreUrl : (isIOS ? appStoreUrl : "https://zoneup.in");

        if (postId && postId.trim() !== "") {
          postId = postId.split("/")[0].split("?")[0].split("#")[0];
          
          let appUrl;
          if (isAndroid) {
            appUrl = `intent:///SharedPost/${encodeURIComponent(postId)}#Intent;scheme=zoneup;package=com.zoneup12345.zoneup;S.browser_fallback_url=${encodeURIComponent(playStoreUrl)};end`;
          } else {
            appUrl = `zoneup:///SharedPost/${encodeURIComponent(postId)}`;
          }
          
          window.location.replace(appUrl);

          if (!isAndroid) {
            setTimeout(function () {
              if (!document.hidden) {
                window.location.replace(fallbackUrl);
              }
            }, 2000);
          }
        } else {
          window.location.replace("https://zoneup.in");
        }
      })();
    </script>
  </head>
  <body>
    <div class="logo-container">
      <img src="https://web-assets-r2.zoneup.in/logo.svg" class="logo" alt="ZoneUp Logo">
    </div>
    <h1>Opening ZoneUp...</h1>
    <p>If you don't have the app installed, you will be redirected to the app store shortly.</p>
  </body>
</html>
